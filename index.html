<!DOCTYPE html>
<html>
<head>
  <title>Manufacturing Defect Classifier</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    #dropzone { border: 2px dashed #888; padding: 40px; text-align: center; cursor: pointer; border-radius: 8px; }
    #dropzone.hover { background: #f0f0f0; }
    #preview { max-width: 300px; margin-top: 20px; display: none; }
    #result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
    #result.ok { background: #e6ffed; border: 1px solid #2ea44f; }
    #result.warn { background: #fff8e6; border: 1px solid #d4a72c; }
    #gradcam { max-width: 300px; margin-top: 10px; display: none; }
    #loading { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Manufacturing Defect Classifier</h1>
  <div id="dropzone">Click or drag an image here</div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <img id="preview">
  <div id="loading">Predicting...</div>
  <div id="result"></div>
  <img id="gradcam">
  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const resultDiv = document.getElementById("result");
    const gradcam = document.getElementById("gradcam");
    const loading = document.getElementById("loading");

    dropzone.onclick = () => fileInput.click();
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add("hover"); };
    dropzone.ondragleave = () => dropzone.classList.remove("hover");
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove("hover");
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    };
    fileInput.onchange = () => { if (fileInput.files.length) handleFile(fileInput.files[0]); };

    function handleFile(file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      resultDiv.style.display = "none";
      gradcam.style.display = "none";
      loading.style.display = "block";

      const formData = new FormData();
      formData.append("file", file);

      fetch("/predict", { method: "POST", body: formData })
        .then(r => r.json())
        .then(data => {
          loading.style.display = "none";
          resultDiv.style.display = "block";
          resultDiv.className = data.low_confidence_warning ? "warn" : "ok";
          resultDiv.innerHTML = `
            <strong>Domain:</strong> ${data.domain} (${(data.domain_confidence*100).toFixed(1)}%)<br>
            <strong>Defect:</strong> ${data.defect} (${(data.defect_confidence*100).toFixed(1)}%)<br>
            ${data.message ? `<strong>Note:</strong> ${data.message}` : ""}
          `;
          if (data.gradcam_base64) {
            gradcam.src = "data:image/png;base64," + data.gradcam_base64;
            gradcam.style.display = "block";
          }
        })
        .catch(err => {
          loading.style.display = "none";
          resultDiv.style.display = "block";
          resultDiv.className = "warn";
          resultDiv.innerHTML = "Error: " + err;
        });
    }
  </script>
</body>
</html>
